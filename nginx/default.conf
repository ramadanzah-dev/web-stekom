server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # File statis dilayani langsung oleh Nginx (seperti "Proxy Extensions" di Vesta)
    location ~* \.(jpe?g|png|gif|bmp|ico|svg|css|js|ttf|otf|webp|woff2?|pdf|zip|mp4|mp3)$ {
        root /home/stekom/web/stekom.darmajaya.ac.id/public_html/public;
        try_files $uri @apache;
        expires max;
    }

    location / {
        proxy_pass http://apache:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @apache {
        proxy_pass http://apache:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}